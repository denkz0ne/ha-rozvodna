<!doctype html>
<html lang="sk"><meta charset="utf-8"><title>Rozvodňa UI test fixture</title>
<style>html,body { height:100%; margin:0; }</style>
<rozvodna-panel></rozvodna-panel>
<script type="module" src="/custom_components/rozvodna/panel/panel.js"></script>
<script type="module">
class TestHaSwitch extends HTMLElement {
  connectedCallback() {
    this.setAttribute("role", "switch");
    this.tabIndex = 0;
    this.setAttribute("aria-checked", String(this.checked));
    this.addEventListener("click", () => this.toggle());
    this.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        this.toggle();
      }
    });
  }
  get checked() { return this.hasAttribute("checked"); }
  get disabled() { return this.hasAttribute("disabled"); }
  set checked(value) {
    this.toggleAttribute("checked", Boolean(value));
    this.setAttribute("aria-checked", String(Boolean(value)));
  }
  toggle() {
    if (this.hasAttribute("disabled")) return;
    this.checked = !this.checked;
    this.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
  }
}
customElements.define("ha-switch", TestHaSwitch);
customElements.define("ha-tooltip", class extends HTMLElement {
  connectedCallback() { this.hidden = true; }
});
const device = (id, title, integration) => ({
  kind: "device", id, title, original_name: title, integration, config_title: title, inherited_labels: [],
  values: { name: null, area_id: null, labels: [] },
});
const entity = (id, title, integration, device_id, options = {}) => ({
  kind: "entity", id, title, original_name: title, integration, device_id, inherited_labels: [],
  readonly: options.readonly ?? false,
  values: { name: null, entity_id: "sensor." + id, area_id: null, labels: [], icon: null,
    hidden_by: options.hidden_by ?? null, disabled_by: options.disabled_by ?? null },
});
const params = new URLSearchParams(location.search);
const data = {
  devices: [device("z", "ZB50 Predsieň", "zha"), device("e", "ESP80 Meteo", "esphome")],
  entities: [entity("light", "Svetlo", "zha", "z"), entity("link", "Kvalita spojenia", "zha", "z"),
    entity("temp", "Teplota", "esphome", "e"), entity("orphan", "Počasie", "template", null)],
  areas: [{ id: "hall", name: "Predsieň", icon: "mdi:door" }],
  labels: [
    { id: "auto", name: "Automatika", icon: "mdi:tag" },
    { id: "test", name: "Testovací", icon: "mdi:tag", color: "#00bcd4" },
  ],
};
const states = {
  "sensor.light": { state: "on", attributes: {} },
  "sensor.link": { state: "unavailable", attributes: {} },
  "sensor.temp": { state: "unknown", attributes: {} },
  "sensor.orphan": { state: "unknown", attributes: { restored: true } },
};
window.moreInfoEvents = [];
document.addEventListener("hass-more-info", (event) => window.moreInfoEvents.push(event.detail.entityId));
if (params.has("features")) {
  data.devices.push(device("living", "Zariadenia", "testspace"));
  data.entities.push(
    entity("disabled", "Zakázaná", "zha", "z", { disabled_by: "user" }),
    entity("hidden", "Skrytá", "zha", "z", { hidden_by: "user" }),
    entity("managed_hidden", "Skrytá integráciou", "zha", "z", { hidden_by: "integration" }),
    entity("readonly", "Neovládateľná", "zha", "z", { readonly: true }),
    entity("living_light", "ObývaČka svetlo", "testspace", "living"),
  );
  for (const id of ["disabled", "hidden", "managed_hidden", "readonly", "living_light"]) {
    states[`sensor.${id}`] = { state: "on", attributes: {} };
  }
}
if (params.has("references")) {
  const automation = entity("automation_ref", "Test automation", "homeassistant", null);
  automation.values.entity_id = "automation.test";
  data.entities.push(automation);
}
if (params.has("large")) {
  for (let i = 0; i < 600; i++) {
    data.devices.push(device("d" + i, "Zariadenie " + i, "zha"));
    for (let j = 0; j < 8; j++) data.entities.push(entity("e" + i + "_" + j, "Entita " + j, "zha", "d" + i));
  }
}
if (params.has("dark")) {
  const tokens = { "primary-text-color": "#fafafa", "secondary-text-color": "#aaa",
    "primary-background-color": "#151515", "card-background-color": "#242424",
    "secondary-background-color": "#303030", "divider-color": "#555" };
  for (const [name, value] of Object.entries(tokens)) document.body.style.setProperty("--" + name, value);
}
let state = JSON.parse(sessionStorage.getItem("test-state") || '{"revision":0,"changes":[],"issues":[]}');
const commits = [];
window.requests = [];
const persist = () => sessionStorage.setItem("test-state", JSON.stringify(state));
const opKey = (op) => [op.kind, op.object_id, op.field].join("/");
document.querySelector("rozvodna-panel").hass = {
  language: "sk", user: { is_admin: !params.has("nonadmin"), id: "test-user" },
  states,
  localize(key) { return key === "component.testspace.title" ? "ObývaČKA" : undefined; },
  async callWS(msg) {
    window.requests.push(msg);
    let result;
    switch (msg.type) {
      case "automation/config": result = { config: {
        trigger: [{ platform: "state", entity_id: "sensor.light" }],
        condition: [{ condition: "template", value_template: "{{ states('sensor.light') }}" }],
      } }; break;
      case "script/config": result = { config: { sequence: [{ action: "light.turn_on", target: { entity_id: "sensor.light" } }] } }; break;
      case "rozvodna/snapshot": result = data; break;
      case "rozvodna/state": result = state; break;
      case "rozvodna/references": result = { token: "preview-token", coverage: {
        dashboards: 1, automations: 1, scripts: 0, yaml_dashboards: 1,
      }, matches: [
        { id: "auto-ref", source_id: "dashboard:home", source_kind: "dashboard", source: "Dashboard · Domov",
          location: "/views/0/cards/0/entity", old: "sensor.light", new: "sensor.new", automatic: true, reason: "" },
      ] }; break;
      case "rozvodna/stage": {
        const changes = new Map(state.changes.map((op) => [opKey(op), op]));
        for (const op of msg.drop || []) changes.delete(opKey(op));
        for (const op of msg.changes) {
          if (JSON.stringify(op.before) === JSON.stringify(op.after)) changes.delete(opKey(op));
          else changes.set(opKey(op), op);
        }
        state = { revision: state.revision + 1, changes: [...changes.values()], issues: [] };
        persist();
        result = state;
        break;
      }
      case "rozvodna/commit": {
        const operations = state.changes.map((op, position) => {
          const row = [...data.devices, ...data.entities].find((item) => item.id === op.object_id);
          row.values[op.field] = op.after;
          return { ...op, position, title: row.title, integration: row.integration, status: "saved" };
        });
        result = { id: "test-commit", status: "saved", operations, user_id: "test-user", created: new Date().toISOString() };
        commits.push(result);
        state = { revision: state.revision + 1, changes: [], issues: [] };
        persist();
        break;
      }
      case "rozvodna/history": result = commits.map((item) => ({ ...item, count: item.operations.length })); break;
      case "rozvodna/detail": result = commits[0]; break;
      case "rozvodna/revert":
        state = { revision: state.revision + 1, issues: [], changes: commits[0].operations
          .filter((op) => !msg.positions || msg.positions.includes(op.position))
          .map((op) => ({ ...op, before: op.after, after: op.before })) };
        persist();
        result = state;
        break;
      default: throw new Error(msg.type);
    }
    return structuredClone(result);
  },
};
</script></html>
